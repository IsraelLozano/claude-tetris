<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="theme-toggle" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-toggle" aria-label="Cambiar tema claro/oscuro" />
        <span class="slider"></span>
      </label>
    </div>
    <h1 class="game-title">Tetris</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section highscore-panel">
          <span class="label">RECORDS</span>
          <ol id="highscore-panel-list" class="highscore-list highscore-list-compact"></ol>
          <button id="highscore-reset-btn" class="highscore-reset-btn" type="button">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-stats" class="highscore-stats"></p>
        <div id="highscore-entry-form" class="highscore-entry-form hidden">
          <label for="highscore-name-input" class="highscore-entry-label">¡Nuevo record! Ingresá tu nombre:</label>
          <input id="highscore-name-input" class="highscore-name-input" type="text" maxlength="12" placeholder="Jugador" />
          <button id="highscore-save-btn" class="highscore-save-btn" type="button">Guardar</button>
        </div>
        <ol id="highscore-overlay-list" class="highscore-list hidden"></ol>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
